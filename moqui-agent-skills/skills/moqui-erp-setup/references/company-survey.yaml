# Questions to ask before writing any setup data. Answers go to survey-answers/company.yaml.
# Each answer feeds one or more setup steps (see the step names in SKILL.md).
company:
  legal_name: {ask: "Legal name of the main company", step: organizations}
  short_code: {ask: "Short code used as id prefix (letters, e.g. ACME)", step: all}
  country: {ask: "Country of the main company (ISO code)", step: organizations}
  currency: {ask: "Accounting currency (ISO code, e.g. EUR)", step: accounting}
  first_fiscal_year: {ask: "First fiscal year to create time periods for", step: accounting}
  addresses: {ask: "Main address, phone, email", step: contacts}
structure:
  divisions: {ask: "Divisions, plants or business units that roll up to the company (name + code)", step: organizations}
  warehouses: {ask: "Warehouses and their locations (name, code, location codes)", step: facilities}
people:
  employees: {ask: "Employees to create now (name, position, division, user name)", step: people}
  user_groups: {ask: "Which application groups each user belongs to", step: people}
products:
  catalog: {ask: "Product lines or categories", step: products}
  products: {ask: "Products to load now (code, name, type inventory or service, list price)", step: products}
optional:
  budgets: {ask: "Budgets to create (year, type, lines by GL account)", step: extensions}
  forms: {ask: "Questionnaires or extra fields needed (who fills them, which questions)", step: forms}
